# ImmunoStream / AIRR preprocessing app with PostgreSQL
# Run: docker compose up --build
# App: http://localhost:80  UI: http://localhost:80/ui/

services:
  postgres:
    image: postgres:16-alpine
    container_name: immunostream-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immunostream
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immunostream"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: immunostream-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/immunostream
      SESSION_FILES_DIR: /data/session_files
    volumes:
      - session_files:/data/session_files
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uvicorn", "app.main:app",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--workers", "4",
        "--timeout-keep-alive", "120"
      ]

  nginx:
    image: nginx:alpine
    container_name: immunostream-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  session_files:
