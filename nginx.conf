server {
    listen 80;

    client_max_body_size 10G;

    # Buffer uploads to disk before forwarding to uvicorn.
    # This prevents slow client connections from tying up app workers.
    client_body_buffer_size 1m;
    client_body_temp_path /tmp/nginx_uploads;

    # Generous timeouts for large bioinformatics file uploads
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;
    client_body_timeout 600s;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
    }
}
